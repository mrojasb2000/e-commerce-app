repos:
    # General file hygiene
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json
            exclude: ^tsconfig\.json$
          - id: check-merge-conflict
          - id: detect-private-key
          - id: check-added-large-files
            args: [--maxkb=1000]

    # ESLint (local hook using project's eslint)
    - repo: local
      hooks:
          - id: eslint
            name: eslint
            entry: pnpm eslint --no-warn-ignored
            language: system
            files: \.(vue|ts|js|mjs)$
            types: [file]

    # Prettier (local hook using project's prettier)
    - repo: local
      hooks:
          - id: prettier
            name: prettier
            entry: pnpm prettier --write --ignore-unknown
            language: system
            files: \.(vue|ts|js|mjs|json|css|md)$
            types_or: [vue, ts, javascript, json, css, markdown]
